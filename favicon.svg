<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Depthgram">
  <defs>
    <filter id="dgBloom" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.52" result="w0"/>
      <feComponentTransfer in="w0" result="wide">
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.15" result="t0"/>
      <feComponentTransfer in="t0" result="tight">
        <feFuncA type="linear" slope="0.85"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="wide"/>
        <feMergeNode in="tight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dgScan" width="4" height="1.50" patternUnits="userSpaceOnUse">
      <rect width="4" height="0.62" fill="#000" opacity="0.42"/>
    </pattern>
    <clipPath id="dgClip">
      <path d="M26.49 11.06 L36.88 25.43 L33.29 26.16 L40.98 36.66 L36.82 37.39 L44.18 47.88 L8.81 47.88 L16.17 37.39 L12.01 36.66 L19.70 26.16 L16.11 25.43Z"/>
      <path d="M32.62 11.06 L43.00 25.43 L39.41 26.16 L47.11 36.66 L42.95 37.39 L50.30 47.88 L14.94 47.88 L22.29 37.39 L18.13 36.66 L25.83 26.16 L22.24 25.43Z"/>
      <path d="M38.23 11.06 L48.61 25.43 L45.02 26.16 L52.72 36.66 L48.56 37.39 L55.91 47.88 L20.55 47.88 L27.90 37.39 L23.74 36.66 L31.44 26.16 L27.85 25.43Z"/>
      <path d="M34.19 47.88 L42.27 47.88 L42.27 54.18 L34.19 54.18Z"/>
    </clipPath>
  </defs>
  <style>
    /* An SVG drawn as an image gets a viewport the size it is drawn at, so the
       same size gating the PNGs use applies here: no scan under 96 px,
       no bloom under 48 px, because neither survives a tab-strip
       favicon. A renderer that ignores this only ever over-decorates. */
    @media (max-width: 95px) { #dgScanRect { display: none } }
    @media (max-width: 47px) { #dgArt { filter: none } }
  </style>
  <rect width="64" height="64" rx="11.26" fill="#0B0B0C"/>
  <g id="dgArt" filter="url(#dgBloom)">
      <path d="M26.49 11.06 L36.88 25.43 L33.29 26.16 L40.98 36.66 L36.82 37.39 L44.18 47.88 L8.81 47.88 L16.17 37.39 L12.01 36.66 L19.70 26.16 L16.11 25.43Z" fill="#6A2BD9"/>
      <path d="M32.62 11.06 L43.00 25.43 L39.41 26.16 L47.11 36.66 L42.95 37.39 L50.30 47.88 L14.94 47.88 L22.29 37.39 L18.13 36.66 L25.83 26.16 L22.24 25.43Z" fill="#0A84FF"/>
      <path d="M38.23 11.06 L48.61 25.43 L45.02 26.16 L52.72 36.66 L48.56 37.39 L55.91 47.88 L20.55 47.88 L27.90 37.39 L23.74 36.66 L31.44 26.16 L27.85 25.43Z" fill="#2BE7F0"/>
      <path d="M34.19 47.88 L42.27 47.88 L42.27 54.18 L34.19 54.18Z" fill="#2BE7F0"/>
  </g>
  <rect id="dgScanRect" width="64" height="64" fill="url(#dgScan)" clip-path="url(#dgClip)"/>
</svg>
